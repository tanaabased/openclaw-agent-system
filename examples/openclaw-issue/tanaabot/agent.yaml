schema-version: 1

agent:
  id: notifications-tanaabot
  name: Notification Tanaabot
  email: tanaabot@tanaab.dev

models:
  default:
    model: aimock/gpt-5.5
    effort: medium

environment:
  set:
    GH_TOKEN_TANAABOT: ${GH_TOKEN_TANAABOT}
  required: [GH_TOKEN_TANAABOT]

git:
  worktrees: {}
  ssh:
    private-keys:
      path: keys/id_ed25519

github:
  username: tanaabot
  token: GH_TOKEN_TANAABOT
  ssh-keys:
    path: keys/id_ed25519.pub
    title: agent-system-issue-__GITHUB_RUN_ID__-__GITHUB_RUN_ATTEMPT__
  notifications:
    schema-version: 2
    runtimes: [openclaw]
    interval-minutes: 1440
    allowed-repository-owners:
      - login: tanaabased
        node-id: __OWNER_NODE_ID__
    issue-assignment:
      mode: plan
      assessment:
        skill: generic-assessment
      allowed:
        - login: emoriwan
          node-id: __ACTOR_NODE_ID__
    review-request:
      paused: false
      allowed:
        - login: emoriwan
          node-id: __ACTOR_NODE_ID__
