schema-version: 1
agent:
  id: backup-example
  name: Backup Example
backup:
  git-ignore: true
  openclaw-state: off
  include:
    - MEMORY.md
    - memory/**
setup:
  runtimes: [openclaw]
  check: |
    test -f backup-applied || openclaw as backup create --json
  apply: |
    archive="$(openclaw agent-system backup create --json | jq -er '.archive')"
    openclaw as backup verify "$archive" --json | jq -e '.status == "verified" and .agentId == "backup-example"'
    touch backup-applied
