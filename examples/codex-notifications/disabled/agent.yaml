schema-version: 1
agent:
  id: codex-disabled-notifications
github:
  username: example-agent
  notifications:
    schema-version: 2
    allowed-repository-owners:
      - login: example-owner
        node-id: O_example
    issue-assignment:
      enabled: false
      allowed:
        - login: example-operator
          node-id: U_operator
      implementation:
        skill: company:implement
      feedback:
        inherit: true
        allowed:
          - login: example-feedback
            node-id: U_feedback
        repairs:
          allowed:
            - login: example-feedback
              node-id: U_feedback
          guidance: Ask a focused clarification for ambiguous changes.
    review-request:
      enabled: false
      allowed:
        - login: example-operator
          node-id: U_operator
      review:
        skill: company:review
      feedback: true
