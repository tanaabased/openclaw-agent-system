schema-version: 1
agent:
  id: pickup
github:
  username: tanaabot
  runtimes: [codex]
  routing:
    - id: defer-review-requests
      match: tanaabased/big-test-bucket
      workflows: [review-request]
      target: deny
    - tanaabased/big-test-bucket: swarm
    - tanaabased/actions: swarm
  issue-assignment: {}
  issue-pickup:
    start: '10 pm'
    window: '1 hour'
    selection:
      guidance: choose useful, ready work within the milestone
    projects:
      - repository: tanaabased/big-test-bucket
        limit: 3
        selection:
          guidance: prefer bounded test coverage improvements
        filters:
          labels: ['ready*', '!blocked', '!needs-*']
          types: ['Bug', 'Task']
        milestone:
          number: 10
          policy: only
      - repository: tanaabased/actions
        selection:
          guidance:
            file: actions-selection.md
        milestone:
          number: 1
          policy: only
