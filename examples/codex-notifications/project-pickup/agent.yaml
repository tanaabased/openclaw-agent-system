schema-version: 1
agent:
  id: pickup
github:
  username: tanaabot
  runtimes: [codex]
  routing:
    - id: defer-review-requests
      match: tanaabased/big-test-bucket
      workflows: [review-request]
      target: deny
    - tanaabased/big-test-bucket: swarm
  issue-assignment: {}
  project-pickup:
    start: '10 pm'
    window: '1 hour'
    selection:
      guidance: choose useful, ready work within the milestone
    projects:
      - repository: tanaabased/big-test-bucket
        milestone:
          number: 10
          policy: only
