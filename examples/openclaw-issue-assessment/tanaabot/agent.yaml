schema-version: 1

agent:
  id: issue-assessment-tanaabot
  name: Notification Tanaabot
  email: tanaabot@tanaab.dev

models:
  default:
    model: aimock/gpt-5.5
    effort: medium

environment:
  set:
    GH_TOKEN_TANAABOT: ${GH_TOKEN_TANAABOT}
  required: [GH_TOKEN_TANAABOT]

git:
  worktrees: {}
  ssh:
    private-keys:
      path: keys/id_ed25519

github:
  username: tanaabot
  token: GH_TOKEN_TANAABOT
  ssh-keys:
    path: keys/id_ed25519.pub
    title: __TEST_RESOURCE_PREFIX__issue-assessment
  schema-version: 3
  runtimes: [openclaw]
  interval-minutes: 1440
  allowed-repository-owners: ['@tanaabased']
  issue-assignment:
    mode: work
    paused: true
    assessment:
      skill: agent-system:agent-system-issue-assessment
    allowed: ['@emoriwan']
    reviewers: ['@tanaabot']
  review-request:
    paused: true
    allowed: ['@emoriwan']
