schema-version: 1

agent:
  id: tanaabot
  name: Tanaabot
  email: tanaabot@tanaab.dev

environment:
  set:
    GH_TOKEN_TANAABOT: ${GH_TOKEN_TANAABOT}
    GIT_SSH_PRIVATE_KEY: ${GIT_SSH_PRIVATE_KEY}
  required:
    - GH_TOKEN_TANAABOT
    - GIT_SSH_PRIVATE_KEY

git:
  extensions:
    big-test-bucket: allow
  worktrees: {}
  signing:
    key: GIT_SSH_PRIVATE_KEY
    allowed-signers-file: .agent-system/allowed_signers
  ssh:
    private-keys:
      path: ~/.ssh/big-test-bucket-ssh

github:
  username: tanaabot
  token: GH_TOKEN_TANAABOT
