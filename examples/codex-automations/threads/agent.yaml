schema-version: 1
agent:
  id: codex-threads
models:
  default: { model: openai/gpt-6-luna, effort: medium }
automations:
  - id: check-builds
    enabled: false
    runtimes: [codex]
    schedule: every 1 hour
    prompt: Review failed builds.
    model: default
    thread: { id: project-activity, name: Project activity }
  - id: review-prs
    enabled: false
    runtimes: [codex]
    schedule: every 2 hours
    prompt: Review open pull requests.
    model: openai/gpt-6-luna
    thread: { id: project-activity, name: Project activity }
