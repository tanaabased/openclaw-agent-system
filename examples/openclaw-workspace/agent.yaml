schema-version: 1

agent:
  id: workspace-tanaabot
  name:
    from-environment: WORKSPACE_NAME
  runtime: codex

environment:
  dotenv:
    - base.env
    - local.env
  set:
    WORKSPACE_NAME: ${AGENT_SYSTEM_WORKSPACE_HOST_NAME} ${WORKSPACE_SUFFIX}
  required:
    - WORKSPACE_NAME
    - WORKSPACE_PRIVATE_VALUE

models:
  default:
    model: openai/gpt-5.4-nano
    effort: medium

setup-host:
  steps:
    - id: host-ready
      runtimes: [openclaw]
      check: [test, -f, host-ready]
      apply: |
        printf 'host\n' >> setup-runs
        touch host-ready

setup-agent:
  file: ./setup.yaml
