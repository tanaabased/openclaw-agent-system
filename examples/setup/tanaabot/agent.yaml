schema-version: 1

agent:
  id: setup-tanaabot
  name: Tanaabot
  email: tanaabot@tanaab.dev

environment:
  set:
    GH_TOKEN_TANAABOT: ${GH_TOKEN_TANAABOT}
  required:
    - GH_TOKEN_TANAABOT

git:
  worktrees:
    repositories:
      local:
        big-test-bucket: ~/tanaab/setup-big-test-bucket
  ssh:
    private-keys:
      path: ~/.ssh/big-test-bucket-ssh

github:
  username: tanaabot
  token: GH_TOKEN_TANAABOT
  ssh-keys:
    path: setup-key.pub
    title: agent-system-setup-__GITHUB_RUN_ID__-__GITHUB_RUN_ATTEMPT__-__RUNNER_OS__

setup-host:
  steps:
    - id: host-tools
      runtimes: [openclaw]
      check: test -f host-tools-ready
      apply: |
        test -z "$AGENT_SYSTEM_GH"
        test -z "$GH_TOKEN"
        touch host-tools-ready

setup-agent:
  file: ./setup.yaml
