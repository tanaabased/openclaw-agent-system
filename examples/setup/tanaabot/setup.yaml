steps:
  - id: codex-only
    runtimes: [codex]
    check: |
      touch forbidden-codex-check
      exit 2
    apply: |
      touch forbidden-codex-apply
      exit 2
  - id: checkout
    runtimes: [openclaw]
    check: |
      test -d "$HOME/tanaab/setup-big-test-bucket/.git"
      test -f checked-runs
      gh api user --jq .login
    apply: |
      test -z "$GH_TOKEN_TANAABOT"
      test -z "$GH_TOKEN"
      test -z "$GIT_SSH_COMMAND"
      test -z "$SSH_AUTH_SOCK"
      gh api user --jq .login > github-login
      if ! test -d "$HOME/tanaab/setup-big-test-bucket/.git"; then
        mkdir -p "$HOME/tanaab"
        git clone --depth 1 git@github.com:tanaabased/big-test-bucket.git "$HOME/tanaab/setup-big-test-bucket"
      fi
      (cd "$HOME/tanaab/setup-big-test-bucket" && git var GIT_AUTHOR_IDENT) > git-identity
      sh host-descendant.sh
      printf 'checked\n' >> checked-runs
  - id: repeatable
    apply: printf 'unchecked\n' >> unchecked-runs
  - id: shared
    runtimes: [openclaw, codex]
    check: [test, -f, shared-ready]
    apply: touch shared-ready
