schema-version: 1

agent:
  id: install-data
  name: Install Data
  email: install-data@example.com

models:
  default:
    model: openai/gpt-5.5
    effort: medium

environment:
  set:
    GH_TOKEN_TANAABOT: ${GH_TOKEN_TANAABOT}
  required: [GH_TOKEN_TANAABOT]

git: {}

github:
  username: tanaabot
  token: GH_TOKEN_TANAABOT
  schema-version: 3
  runtimes: [openclaw]
  allowed-repository-owners: ['@tanaabased']
  issue-assignment:
    paused: true
    allowed: []
