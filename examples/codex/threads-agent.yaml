schema-version: 1
agent:
  id: codex-threads
automations:
  - id: check-builds
    enabled: false
    runtimes: [codex]
    schedule: every 1 hour
    prompt: Review failed builds.
    thread: { id: project-activity, name: Project activity }
  - id: review-prs
    enabled: false
    runtimes: [codex]
    schedule: every 2 hours
    prompt: Review open pull requests.
    thread: { id: project-activity, name: Project activity }
