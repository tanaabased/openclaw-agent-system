schema-version: 1
agent:
  id: codex-example
  name: Codex Example
models:
  default: { model: openai/gpt-6-astra, effort: high }
  low: { model: openai/gpt-5.6-terra, effort: medium }
  medium: { model: openai/gpt-5.6-sol, effort: high }
  high: { model: openai/gpt-6-astra, effort: xhigh }
setup:
  steps:
    - id: shared
      check: test -f .codex-shared
      apply: touch .codex-shared
    - id: codex-only
      runtimes: [codex]
      apply: touch .codex-only
    - id: openclaw-only
      runtimes: [openclaw]
      check: touch .openclaw-checked
      apply: touch .openclaw-only
git:
  worktrees:
    root: worktrees
github:
  notifications:
    approved-actors:
      - login: operator
        node-id: U_operator
