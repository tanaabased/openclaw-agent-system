routing:
  - match: tanaabased/big-test-bucket
    workflows: [review-request]
    target: deny
  - match: tanaabased/big-test-bucket
    target: swarm
project-pickup:
  schedule: every 2 days
  window-minutes: 1440
  projects:
    - repository: tanaabased/big-test-bucket
      milestone: { number: __MILESTONE_NUMBER__, policy: only }
