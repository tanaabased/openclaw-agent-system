schema-version: 1

agent:
  id: install-data
  name: Install Data
  email: install-data@example.com

models:
  default:
    model: openai/gpt-5.5
    effort: medium

environment:
  set:
    GH_TOKEN_FIXTURE: synthetic-os-enrollment-token

git: {}

github:
  username: install-data
  host: github.com
  token: GH_TOKEN_FIXTURE
  schema-version: 3
  runtimes: [openclaw]
  allowed-repository-owners: ['@fixture']
  issue-assignment:
    paused: true
    allowed: []

automations:
  - id: cold-install-command
    enabled: false
    runtimes: [openclaw]
    schedule: every 1 hour
    run:
      command: git
      args: [--version]
