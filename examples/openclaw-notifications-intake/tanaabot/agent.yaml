schema-version: 1

agent:
  id: intake-tanaabot
  name: Notification Tanaabot
  email: tanaabot@tanaab.dev

models:
  routing:
    skill: intake-routing
    guidance: { file: routing.md }
  default:
    model: aimock/gpt-5.5
    effort: medium

environment:
  set:
    GH_TOKEN_TANAABOT: ${GH_TOKEN_TANAABOT}
  required: [GH_TOKEN_TANAABOT]

git:
  worktrees: {}
  ssh:
    private-keys:
      path: keys/id_ed25519

github:
  schema-version: 3
  username: tanaabot
  token: GH_TOKEN_TANAABOT
  ssh-keys:
    path: keys/id_ed25519.pub
    title: agent-system-intake-__GITHUB_RUN_ID__-__GITHUB_RUN_ATTEMPT__
  runtimes: [openclaw]
  interval-minutes: 1440
  allowed-repository-owners:
    - login: tanaabased
      node-id: __OWNER_NODE_ID__
  issue-assignment:
    mode: plan
    allowed:
      - login: emoriwan
        node-id: __ACTOR_NODE_ID__
      - login: tanaabot
        node-id: __RECEIVER_NODE_ID__
  review-request:
    paused: false
    allowed:
      - login: emoriwan
        node-id: __ACTOR_NODE_ID__
