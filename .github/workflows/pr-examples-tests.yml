name: Example tests

on:
  pull_request:

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: '1'
  NO_COLOR: '1'

jobs:
  examples:
    name: ${{ matrix.example }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26
          - ubuntu-24.04
        example:
          - install
          - validate
          - doctor
          - agent
          - identity
          - memory
          - models
          - path
          - env
          - credentials
          - git
          - worktree
          - github
          - routing
          - tool
          - security
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: PATH updates
        shell: bash
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "OPENCLAW_CI_PROFILE=agent-system-ci" >> "$GITHUB_ENV"
          echo "OPENCLAW_CI_WORKSPACE=$RUNNER_TEMP/main" >> "$GITHUB_ENV"
          echo "OPENCLAW_CI_STATE_DIR=$RUNNER_TEMP/openclaw-ci" >> "$GITHUB_ENV"
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/scripts" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Brew updates
        shell: bash
        run: |
          HOMEBREW_NO_AUTO_UPDATE= brew update-if-needed
          brew install coreutils
      - name: Install Node
        uses: tanaabased/actions/setup-node@v1
        with:
          test-mode: true
      - name: Install Bun
        uses: tanaabased/actions/setup-bun@v1
        with:
          test-mode: true
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Prepare release-shaped source
        uses: tanaabased/actions/prepare-release@v1
        with:
          test-mode: true
          version: 0.0.0-ci.${{ github.event.pull_request.head.sha }}
          release-date: '2026-01-01T00:00:00Z'
          release-url: https://github.com/${{ github.repository }}/releases/tag/0.0.0-ci.${{ github.event.pull_request.head.sha }}
          commands: |
            version-injector openclaw.plugin.json --style json --version "$PREPARE_RELEASE_VERSION"
            bun run format:write
            bun run build
      - name: Check prepared source
        run: bun run format:check
      - name: Install OpenClaw
        uses: tanaabased/actions/setup-openclaw@v1
        with:
          test-mode: true
      - name: Prepare isolated OpenClaw
        shell: bash
        run: |
          openclaw-setup \
            --profile "$OPENCLAW_CI_PROFILE" \
            --workspace "$OPENCLAW_CI_WORKSPACE" \
            --state-dir "$OPENCLAW_CI_STATE_DIR"
      - name: Install prepared Agent System
        uses: tanaabased/actions/setup-agent-system@v1
        with:
          test-mode: true
          source-directory: .
      - name: Configure Agent System test policy
        shell: bash
        run: openclaw config set plugins.entries.agent-system.config.opCache '{"mode":"process-lifetime","maxEntries":128}' --strict-json
      - name: Create SSH test key
        id: ssh-key
        if: matrix.example == 'git'
        uses: tanaabased/actions/ssh-test-key@v1
        with:
          test-mode: true
          destination: ${{ runner.temp }}/big-test-bucket-ssh
          comment: agent-system-leia
      - name: Install SSH test key
        if: matrix.example == 'git'
        shell: bash
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          cp "${{ steps.ssh-key.outputs.private-key-path }}" "$HOME/.ssh/big-test-bucket-ssh"
          cp "${{ steps.ssh-key.outputs.public-key-path }}" "$HOME/.ssh/big-test-bucket-ssh.pub"
          chmod 600 "$HOME/.ssh/big-test-bucket-ssh"
          chmod 644 "$HOME/.ssh/big-test-bucket-ssh.pub"
      - name: Prepare Secret Service
        if: runner.os == 'Linux' && matrix.example == 'credentials'
        shell: bash
        env:
          DBUS_SESSION_BUS_ADDRESS: unix:path=${{ runner.temp }}/secret-service-bus
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes dbus-x11 gnome-keyring libsecret-tools
          mkdir -p "$RUNNER_TEMP/secret-service-home"
          dbus-daemon --session --fork --address="$DBUS_SESSION_BUS_ADDRESS" --print-address=1
          printf '%s' 'test-keyring-password' \
            | HOME="$RUNNER_TEMP/secret-service-home" gnome-keyring-daemon --unlock --components=secrets >/dev/null
      - name: Allow unattended tool execution
        if: contains(fromJSON('["credentials","github","path","security"]'), matrix.example)
        run: openclaw exec-policy preset yolo
      - name: Run Leia-backed example
        shell: bash
        env:
          DBUS_SESSION_BUS_ADDRESS: ${{ runner.os == 'Linux' && matrix.example == 'credentials' && format('unix:path={0}/secret-service-bus', runner.temp) || '' }}
          DEFAULT_CREDENTIAL_STORE: ${{ runner.os == 'macOS' && 'keychain' || 'secret-service' }}
          GH_TOKEN_EMORI: ${{ secrets.GH_TOKEN_EMORI }}
          GH_TOKEN_TANAABOT: ${{ secrets.GH_TOKEN_TANAABOT }}
          OPENCLAW_DEBUG_CODE_MODE: ${{ runner.debug == '1' && '1' || '' }}
          OPENCLAW_DEBUG_MODEL_PAYLOAD: ${{ runner.debug == '1' && 'tools' || '' }}
          OPENCLAW_DEBUG_MODEL_TRANSPORT: ${{ runner.debug == '1' && '1' || '' }}
          OPENCLAW_DEBUG_SSE: ${{ runner.debug == '1' && 'events' || '' }}
          OPENCLAW_LOG_LEVEL: ${{ runner.debug == '1' && 'debug' || '' }}
          OPENCLAW_PLUGIN_LIFECYCLE_TRACE: ${{ runner.debug == '1' && '1' || '' }}
          OPENAI_API_KEY: ${{ secrets.TANAAB_ALTERNATE_MALE_KEY }}
          OPENAI_MODEL: gpt-5.4-nano
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.TANAAB_OP_TESTVAULT }}
        run: bun run leia "examples/${{ matrix.example }}/README.md" --stdin --retry 0
      - name: RUNNING A LEVEL THREE DIAGNOSTICS
        if: failure()
        shell: bash
        run: |
          openclaw-diagnostics \
            --profile "$OPENCLAW_CI_PROFILE" \
            --workspace "$OPENCLAW_CI_WORKSPACE" \
            --state-dir "$OPENCLAW_CI_STATE_DIR"
          openclaw doctor || true
