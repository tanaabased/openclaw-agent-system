name: Example tests

on:
  pull_request:

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: '1'
  NO_COLOR: '1'

jobs:
  examples:
    name: ${{ matrix.example }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26
          - ubuntu-24.04
        example:
          - agent
          - approval
          - codex
          - containment
          - credentials
          - doctor
          - env
          - git
          - github
          - google
          - identity
          - install
          - memory
          - models
          - path
          - routing
          - setup
          - tool
          - validate
          - worktree
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: PATH updates
        shell: bash
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/scripts" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Brew updates
        shell: bash
        run: |
          HOMEBREW_NO_AUTO_UPDATE= brew update-if-needed
          brew install coreutils
      - name: Install Node
        uses: tanaabased/actions/setup-node@v1
      - name: Install Bun
        uses: tanaabased/actions/setup-bun@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Prepare release-shaped build
        uses: tanaabased/prepare-release-action@v1
        with:
          version: dev
          sync: false
          commands: |
            version-injector .codex-plugin/plugin.json --style json --version "$PREPARE_RELEASE_VERSION"
            version-injector openclaw.plugin.json --style json --version "$PREPARE_RELEASE_VERSION"
            bun run format:write
            bun run build
      - name: Check prepared plugin
        run: |
          bun run plugin:check
          bun run format:check
      - name: Pack prepared plugin
        id: pack
        uses: tanaabased/actions/npm-pack@v1
      - name: Install OpenClaw
        uses: tanaabased/actions/setup-openclaw@v1
      - name: Install reviewed GoG
        if: matrix.example == 'google'
        shell: bash
        run: |
          case "$RUNNER_OS/$(uname -m)" in
            Linux/x86_64)
              asset=gogcli_0.42.0_linux_amd64.tar.gz
              checksum=1967a962a57d689958c408dd0abc784792c3712da9d0a90650bb76ab7e3de388
              ;;
            macOS/arm64)
              asset=gogcli_0.42.0_darwin_arm64.tar.gz
              checksum=6a92b35473ed057c55677c2ba7d5af8e154d1bad23fa35e74994bc2f3bce4672
              ;;
            macOS/x86_64)
              asset=gogcli_0.42.0_darwin_amd64.tar.gz
              checksum=f28d7f64fb85d726e4757261a02879f35968ad7096fe00761cd9eda8e9f6d2dd
              ;;
            *) exit 1 ;;
          esac
          mkdir -m 700 "$RUNNER_TEMP/gog-bin"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/gog.tar.gz" "https://github.com/openclaw/gogcli/releases/download/v0.42.0/$asset"
          printf '%s  %s\n' "$checksum" "$RUNNER_TEMP/gog.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gog.tar.gz" -C "$RUNNER_TEMP/gog-bin"
          echo "$RUNNER_TEMP/gog-bin" >> "$GITHUB_PATH"
      - name: Run Leia-backed example
        shell: bash
        env:
          AGENT_SYSTEM_PACKAGE: ${{ steps.pack.outputs.tarball-path }}
          CODEX_HOME: ${{ runner.temp }}/codex-home
          CODEX_TOOLS_CODEX_HOME: ${{ runner.temp }}/codex-home
          DBUS_SESSION_BUS_ADDRESS: ${{ runner.os == 'Linux' && matrix.example == 'credentials' && format('unix:path={0}/secret-service-bus', runner.temp) || '' }}
          DEFAULT_CREDENTIAL_STORE: ${{ runner.os == 'macOS' && 'keychain' || 'secret-service' }}
          GH_TOKEN_EMORI: ${{ secrets.GH_TOKEN_EMORI }}
          GH_TOKEN_TANAABOT: ${{ secrets.GH_TOKEN_TANAABOT }}
          OPENCLAW_DEBUG_CODE_MODE: ${{ runner.debug == '1' && '1' || '' }}
          OPENCLAW_DEBUG_MODEL_PAYLOAD: ${{ runner.debug == '1' && 'tools' || '' }}
          OPENCLAW_DEBUG_MODEL_TRANSPORT: ${{ runner.debug == '1' && '1' || '' }}
          OPENCLAW_DEBUG_SSE: ${{ runner.debug == '1' && 'events' || '' }}
          OPENCLAW_LOG_LEVEL: ${{ runner.debug == '1' && 'debug' || '' }}
          OPENCLAW_PLUGIN_LIFECYCLE_TRACE: ${{ runner.debug == '1' && '1' || '' }}
          OPENAI_API_KEY: ${{ secrets.TANAAB_ALTERNATE_MALE_KEY }}
          OPENAI_MODEL: gpt-5.4-nano
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.TANAAB_OP_TESTVAULT }}
        run: bun run leia "examples/${{ matrix.example }}/README.md" --stdin --retry 0
      - name: RUNNING A LEVEL THREE DIAGNOSTICS
        if: failure()
        shell: bash
        run: openclaw-diagnostics
