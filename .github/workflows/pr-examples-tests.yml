name: Example tests

on:
  pull_request:

permissions:
  contents: read

env:
  HOMEBREW_NO_AUTO_UPDATE: '1'

jobs:
  examples:
    name: ${{ matrix.example }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-26
          - ubuntu-24.04
        example:
          - install
          - validate
          - doctor
          - agent
          - identity
          - path
          - env
          - credentials
          - git
          - worktree
          - github
          - notifications
          - tool
          - security
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Put Homebrew on PATH
        shell: bash
        run: echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
      - name: Refresh Homebrew when needed
        shell: bash
        run: HOMEBREW_NO_AUTO_UPDATE= brew update-if-needed
      - name: Install OpenClaw CLI
        shell: bash
        run: |
          brew install openclaw-cli
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"
      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install Linux Secret Service test dependencies
        if: runner.os == 'Linux' && matrix.example == 'credentials'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes dbus-x11 gnome-keyring libsecret-tools
          mkdir -p "$RUNNER_TEMP/secret-service-home"
          dbus_address="$(dbus-daemon --session --fork --print-address=1)"
          test -n "$dbus_address"
          export DBUS_SESSION_BUS_ADDRESS="$dbus_address"
          echo "DBUS_SESSION_BUS_ADDRESS=$dbus_address" >> "$GITHUB_ENV"
          printf '%s' 'test-keyring-password' | HOME="$RUNNER_TEMP/secret-service-home" gnome-keyring-daemon --unlock --components=secrets
      - name: Prepare release-shaped build
        uses: tanaabased/prepare-release-action@v1
        with:
          version: dev
          sync: false
          commands: |
            version-injector openclaw.plugin.json --style json --version "$PREPARE_RELEASE_VERSION"
            bun run format:write
            bun run build
      - name: Pack prepared plugin
        shell: bash
        run: |
          bun run plugin:check
          bun run format:check
          archive_name="$(npm pack --silent --pack-destination "$RUNNER_TEMP")"
          test -n "$archive_name"
          echo "AGENT_SYSTEM_PACKAGE=$RUNNER_TEMP/$archive_name" >> "$GITHUB_ENV"
      - name: Prepare test SSH key
        id: test-ssh-key
        shell: bash
        run: |
          ssh-keygen -q -t ed25519 -N '' -C agent-system-leia -f "$RUNNER_TEMP/agent-system-test-ssh"
          printf 'private-key<<EOF\n%s\nEOF\n' "$(cat "$RUNNER_TEMP/agent-system-test-ssh")" >> "$GITHUB_OUTPUT"
      - name: Run Leia-backed example
        shell: bash
        env:
          DEFAULT_CREDENTIAL_STORE: ${{ runner.os == 'macOS' && 'keychain' || 'secret-service' }}
          NO_COLOR: '1'
          OPENAI_API_KEY: ${{ secrets.TANAAB_ALTERNATE_MALE_KEY }}
          OPENAI_MODEL: gpt-5.4-nano
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.TANAAB_OP_TESTVAULT }}
          TEST_SSH_KEY: ${{ steps.test-ssh-key.outputs.private-key }}
          TMPDIR: ${{ runner.temp }}
        run: bun run leia "examples/${{ matrix.example }}/README.md" --stdin --retry 0
