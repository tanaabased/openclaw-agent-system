name: OpenClaw notification tests

on:
  pull_request:
  workflow_dispatch:
    inputs:
      profile:
        description: Capture GitHub request metadata (select the audit examples before launching)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: examples-notifications-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: '1'
  NO_COLOR: '1'

jobs:
  examples:
    name: ${{ matrix.example }} (ubuntu-24.04)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        example:
          - openclaw-notifications-intake
          - openclaw-notifications-assessment-recovery
          - openclaw-notifications-feedback-policy
          - openclaw-notifications-assignment-policy
          - openclaw-notifications-reactivation
          - openclaw-notifications-retirement
          - openclaw-notifications-reset
          - openclaw-notifications-issue-journey
          - openclaw-notifications-conversation
          - openclaw-notifications-pr-journey
          - openclaw-notifications-pr-recipients
          - openclaw-notifications-pr-update
          - openclaw-notifications-pr-presentation
          - openclaw-notifications-pr-collaboration
          - openclaw-notifications-pr-discovery
          - openclaw-notifications-pr-reply-recovery
          - openclaw-notifications-progression
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: PATH updates
        shell: bash
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/scripts" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Brew updates
        shell: bash
        run: HOMEBREW_NO_AUTO_UPDATE= brew update-if-needed
      - name: Install OpenClaw
        uses: tanaabased/actions/setup-openclaw@v1
      - name: Install Node
        uses: tanaabased/actions/setup-node@v1
      - name: Install Bun
        uses: tanaabased/actions/setup-bun@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Prepare release-shaped build
        uses: tanaabased/actions/prepare-release@v1
        with:
          version: dev
          commands: |
            version-injector .codex-plugin/plugin.json --style json --version "$PREPARE_RELEASE_VERSION"
            version-injector openclaw.plugin.json --style json --version "$PREPARE_RELEASE_VERSION"
            bun run format:write
            bun run build
      - name: Check prepared plugin
        run: |
          bun run plugin:check
          bun run format:check
      - name: Pack prepared plugin
        id: pack
        uses: tanaabased/actions/npm-pack@v1
      - name: Run Leia-backed example
        shell: bash
        env:
          AGENT_SYSTEM_PACKAGE: ${{ steps.pack.outputs.tarball-path }}
          CODEX_HOME: ${{ runner.temp }}/codex-home
          CODEX_TOOLS_CODEX_HOME: ${{ runner.temp }}/codex-home
          GH_TOKEN_EMORI: ${{ secrets.GH_TOKEN_EMORI }}
          XDG_CONFIG_HOME: ${{ runner.temp }}/agent-system-config
          GH_TOKEN_TANAABOT: ${{ secrets.GH_TOKEN_TANAABOT }}
          AGENT_SYSTEM_GITHUB_PROFILE_DIR: ${{ inputs.profile && format('{0}/github-profile', runner.temp) || '' }}
        run: |
          if [[ -n "$AGENT_SYSTEM_GITHUB_PROFILE_DIR" ]]; then
            native_gh=$(command -v gh)
            mkdir -p "$AGENT_SYSTEM_GITHUB_PROFILE_DIR/bin"
            chmod 700 "$AGENT_SYSTEM_GITHUB_PROFILE_DIR"
            printf '#!/usr/bin/env bash\nexec node --import tsx %q %q "$@"\n' "$GITHUB_WORKSPACE/scripts/github-profile-command.ts" "$native_gh" > "$AGENT_SYSTEM_GITHUB_PROFILE_DIR/bin/gh"
            chmod 700 "$AGENT_SYSTEM_GITHUB_PROFILE_DIR/bin/gh"
            export PATH="$AGENT_SYSTEM_GITHUB_PROFILE_DIR/bin:$PATH"
          fi
          report_api_budget() {
            GH_TOKEN="$GH_TOKEN_TANAABOT" gh api rate_limit --jq '{account:"tanaabot", resources:(.resources | {core: (.core | {limit,remaining,reset}), graphql: (.graphql | {limit,remaining,reset})})}' || true
            GH_TOKEN="$GH_TOKEN_EMORI" gh api rate_limit --jq '{account:"emoriwan", resources:(.resources | {core: (.core | {limit,remaining,reset}), graphql: (.graphql | {limit,remaining,reset})})}' || true
          }
          trap report_api_budget EXIT
          report_api_budget
          leia "examples/${{ matrix.example }}/README.md" --stdin --retry 0
      - name: Summarize GitHub request profile
        if: ${{ always() && inputs.profile }}
        run: node --import tsx scripts/github-profile-report.ts "$RUNNER_TEMP/github-profile" >> "$GITHUB_STEP_SUMMARY"
      - name: RUNNING A LEVEL THREE DIAGNOSTICS
        if: failure()
        shell: bash
        run: |
          jq -s '[.. | objects | select(.providerDiagnostic? != null) | {code, providerDiagnostic, retry, retryAfter}]' "$RUNNER_TEMP/agent-system-config/tanaab/agent-system/agent-system-dispatch-v2/"*.json || true
          if [[ -d "${OPENCLAW_WORKSPACE:-}" ]]; then
            openclaw-diagnostics
          else
            echo "No OpenClaw workspace was created; see the scenario failure output above."
          fi
