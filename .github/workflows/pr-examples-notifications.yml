name: Notification fixture cleanup

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispose only retained fixtures from run 39903842345
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN_TANAABOT }}
          GH_TOKEN_EMORI: ${{ secrets.GH_TOKEN_EMORI }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          const repository = 'repos/tanaabased/big-test-bucket';
          const fixtures = [
            {pr: 7520, issue: 7511, head: '7511-document-disposable-test-issue-cleanup-7be8ad5b2b0af8c8', sha: 'f0a20f508b8f3fa49975b9f0987f27371cd435de'},
            {pr: 7518, issue: 7506, head: '7506-document-disposable-test-issue-cleanup-7c11bdc9d24278c0', sha: 'edcf620514675d386443a6463dc1368f00503edb'},
          ];
          function api(route, ...args) {
            return JSON.parse(execFileSync('gh', ['api', route, ...args], {encoding: 'utf8'}));
          }
          function identity(account, token, minimum) {
            const response = execFileSync('gh', ['api', '--include', 'user'], {
              encoding: 'utf8', env: {...process.env, GH_TOKEN: token},
            });
            const body = JSON.parse(response.slice(response.indexOf('{')));
            assert.equal(body.login, account);
            const remaining = Number(response.match(/^x-ratelimit-remaining:\s*(\d+)/im)?.[1]);
            const reset = Number(response.match(/^x-ratelimit-reset:\s*(\d+)/im)?.[1]);
            console.log(JSON.stringify({account, resource: 'core', remaining, reset}));
            assert.ok(Number.isFinite(remaining) && remaining >= minimum, 'insufficient fresh quota for trial');
          }
          identity('tanaabot', process.env.GH_TOKEN, 4900);
          identity('emoriwan', process.env.GH_TOKEN_EMORI, 4000);
          for (const fixture of fixtures) {
            const issue = api(repository + '/issues/' + fixture.issue);
            assert.equal(issue.user.login, 'emoriwan');
            assert.equal(issue.title, 'Agent System pr flow 39903842345-1');
            assert.ok(issue.body.startsWith('This is a disposable Agent System notification-flow fixture.'));
            const pr = api(repository + '/pulls/' + fixture.pr);
            assert.equal(pr.user.login, 'tanaabot');
            assert.equal(pr.head.repo.full_name, 'tanaabased/big-test-bucket');
            assert.equal(pr.head.ref, fixture.head);
            assert.equal(pr.head.sha, fixture.sha);
            assert.equal(pr.merged, false);
            assert.ok(pr.body.endsWith('/issues/' + fixture.issue));
          }
          const titles = new Set([
            'agent-system-pr-39903842345-1',
            'agent-system-pr-reply-recovery-39903842345-1',
            'agent-system-retirement-39903842345-1',
          ]);
          const keys = api('user/keys', '--paginate', '--slurp').flat().filter(key => titles.has(key.title));
          for (const fixture of fixtures) {
            assert.equal(api(repository + '/pulls/' + fixture.pr, '--method', 'PATCH', '-f', 'state=closed').state, 'closed');
            execFileSync('gh', ['api', repository + '/git/refs/heads/' + fixture.head, '--method', 'DELETE'], {stdio: 'pipe'});
            assert.equal(api(repository + '/issues/' + fixture.issue, '--method', 'PATCH', '-f', 'state=closed').state, 'closed');
            console.log(JSON.stringify({closedIssue: fixture.issue, closedPr: fixture.pr, deletedBranch: fixture.head}));
          }
          for (const key of keys) {
            execFileSync('gh', ['api', 'user/keys/' + key.id, '--method', 'DELETE'], {stdio: 'pipe'});
            console.log(JSON.stringify({deletedKeyTitle: key.title}));
          }
          assert.equal(api('user/keys', '--paginate', '--slurp').flat().filter(key => titles.has(key.title)).length, 0);
          for (const fixture of fixtures) {
            assert.equal(api(repository + '/pulls/' + fixture.pr).state, 'closed');
            assert.equal(api(repository + '/issues/' + fixture.issue).state, 'closed');
            let absent = false;
            try { api(repository + '/git/ref/heads/' + fixture.head); }
            catch (error) { absent = /HTTP 404/.test(String(error.stderr)); }
            assert.ok(absent, 'fixture branch removal not verified');
          }
          identity('tanaabot', process.env.GH_TOKEN, 4800);
          identity('emoriwan', process.env.GH_TOKEN_EMORI, 4000);
          console.log('bounded fixture cleanup verified; quota ready for one full trial');
          NODE
