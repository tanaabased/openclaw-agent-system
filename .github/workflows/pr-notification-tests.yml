name: Notification Tests

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: notification-test-account
  cancel-in-progress: false

jobs:
  notifications:
    # temporary #135 and #214 checkpoints; restore before final acceptance.
    if: false
    name: ${{ matrix.scenario }}
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - assignment
          - guided-assignment
          - implementation
          - pr-lifecycle
          - comment
          - retirement
          - operator-access
    uses: ./.github/workflows/reusable-notification-test.yml
    with:
      provider: mock
      runner: ubuntu-24.04
      scenario: ${{ matrix.scenario }}
    secrets:
      gh_token_emori: ${{ secrets.GH_TOKEN_EMORI }}
      gh_token_tanaabot: ${{ secrets.GH_TOKEN_TANAABOT }}
  concurrency:
    needs: notifications
    if: false
    uses: ./.github/workflows/reusable-notification-test.yml
    with:
      provider: mock
      runner: ubuntu-24.04
      scenario: concurrency
    secrets:
      gh_token_emori: ${{ secrets.GH_TOKEN_EMORI }}
      gh_token_tanaabot: ${{ secrets.GH_TOKEN_TANAABOT }}
