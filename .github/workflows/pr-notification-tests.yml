name: Notification Tests

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: notification-test-account
  cancel-in-progress: false

jobs:
  notifications:
    name: ${{ matrix.scenario }}
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - assignment
          - guided-assignment
          - implementation
          - pr-lifecycle
          - comment
          - retirement
    uses: ./.github/workflows/reusable-notification-test.yml
    with:
      provider: mock
      runner: ubuntu-24.04
      scenario: ${{ matrix.scenario }}
    secrets:
      op_service_account_token: ${{ secrets.TANAAB_OP_TESTVAULT }}
  concurrency:
    needs: notifications
    if: ${{ always() && !cancelled() }}
    uses: ./.github/workflows/reusable-notification-test.yml
    with:
      provider: mock
      runner: ubuntu-24.04
      scenario: concurrency
    secrets:
      op_service_account_token: ${{ secrets.TANAAB_OP_TESTVAULT }}
