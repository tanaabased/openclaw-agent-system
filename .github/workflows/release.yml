name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  publish-npm:
    name: Publish npm
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      TERM: xterm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install Bun
        uses: tanaabased/actions/setup-bun@v1
      - name: Install Node
        uses: tanaabased/actions/setup-node@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Validate source
        run: |
          bun run lint
          bun run typecheck
          bun run test
          bun run plugin:check
      - name: Prepare release
        uses: tanaabased/actions/prepare-release@v1
        with:
          commands: |
            version-injector .codex-plugin/plugin.json --style json --version "$PREPARE_RELEASE_VERSION"
            version-injector openclaw.plugin.json --style json --version "$PREPARE_RELEASE_VERSION"
            bun run format:write
      - name: Validate prepared package
        run: |
          bun run build
          bun run format:check
      - name: Pack prepared package
        id: pack
        uses: tanaabased/actions/npm-pack@v1
      - name: Validate packed plugin package
        env:
          AGENT_SYSTEM_PACKAGE: ${{ steps.pack.outputs.tarball-path }}
        run: bun run test:release
      - name: Stage packaged Codex plugin
        env:
          AGENT_SYSTEM_PACKAGE: ${{ steps.pack.outputs.tarball-path }}
        run: |
          mkdir -p .temp/codex-plugin
          tar -xzf "$AGENT_SYSTEM_PACKAGE" -C .temp/codex-plugin --strip-components=1
      - name: Validate packaged Codex plugin
        uses: tanaabased/actions/validate-codex-plugin@v1
        with:
          plugin-directory: .temp/codex-plugin
      - name: Verify installed Codex skills
        env:
          AGENT_SYSTEM_PACKAGE: ${{ steps.pack.outputs.tarball-path }}
        run: bun run test:codex-plugin
      - name: Publish npm
        uses: tanaabased/actions/publish-npm@v1
        with:
          tarball: ${{ steps.pack.outputs.tarball-path }}
          sync-edge-tag: true

  publish-clawhub:
    name: Publish ClawHub
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      TERM: xterm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install Bun
        uses: tanaabased/actions/setup-bun@v1
      - name: Install Node
        uses: tanaabased/actions/setup-node@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Validate source
        run: |
          bun run lint
          bun run typecheck
          bun run test
          bun run plugin:check
      - name: Prepare release
        uses: tanaabased/actions/prepare-release@v1
        with:
          commands: |
            version-injector .codex-plugin/plugin.json --style json --version "$PREPARE_RELEASE_VERSION"
            version-injector openclaw.plugin.json --style json --version "$PREPARE_RELEASE_VERSION"
            bun run format:write
      - name: Validate prepared package
        run: |
          bun run build
          bun run format:check
      - name: Pack prepared package
        id: pack
        uses: tanaabased/actions/npm-pack@v1
      - name: Validate packed plugin package
        env:
          AGENT_SYSTEM_PACKAGE: ${{ steps.pack.outputs.tarball-path }}
        run: bun run test:release
      - name: Publish ClawHub
        id: publish-clawhub
        continue-on-error: true
        uses: tanaabased/actions/publish-clawhub@v1
        with:
          tarball: ${{ steps.pack.outputs.tarball-path }}
          owner: tanaab
          source-repo: ${{ github.repository }}
          source-commit: ${{ github.sha }}
          clawhub-token: ${{ secrets.TANAAB_LOBSTER_BOAT }}
          wait-timeout: 1800
      # remove after openclaw/clawhub#3888 is deployed and full-archive publication succeeds.
      - name: Prepare ClawHub fallback without source maps
        if: ${{ steps.publish-clawhub.outcome == 'failure' }}
        env:
          AGENT_SYSTEM_PACKAGE: ${{ steps.pack.outputs.tarball-path }}
        run: bun scripts/clawhub-fallback-task.ts "$AGENT_SYSTEM_PACKAGE" "$RUNNER_TEMP/clawhub-fallback.tgz"
      - name: Validate ClawHub fallback package
        if: ${{ steps.publish-clawhub.outcome == 'failure' }}
        env:
          AGENT_SYSTEM_PACKAGE: ${{ runner.temp }}/clawhub-fallback.tgz
          AGENT_SYSTEM_PACKAGE_WITHOUT_SOURCE_MAPS: 'true'
        run: bun run test:release
      - name: Publish ClawHub fallback
        if: ${{ steps.publish-clawhub.outcome == 'failure' }}
        # use the revision before forced staging so the smaller fallback uploads directly.
        uses: tanaabased/actions/publish-clawhub@87204fe1afd3784873160d98fb7561ab9493fb03
        with:
          tarball: ${{ runner.temp }}/clawhub-fallback.tgz
          owner: tanaab
          source-repo: ${{ github.repository }}
          source-commit: ${{ github.sha }}
          clawhub-token: ${{ secrets.TANAAB_LOBSTER_BOAT }}
          wait-timeout: 1800

  publish-repo:
    name: Publish repo
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TERM: xterm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install Bun
        uses: tanaabased/actions/setup-bun@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Publish repo
        uses: tanaabased/actions/publish-repo@v1
        with:
          commands: |
            version-injector .codex-plugin/plugin.json --style json --version "$PREPARE_RELEASE_VERSION"
            version-injector openclaw.plugin.json --style json --version "$PREPARE_RELEASE_VERSION"
            bun run format:write
          sync-token: ${{ secrets.TANAAB_COAXIUM_INJECTOR }}
