name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  release-npm:
    name: Publish npm package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      TERM: xterm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Bun
        uses: tanaabased/actions/setup-bun@v1
      - name: Install Node
        uses: tanaabased/actions/setup-node@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Validate source
        run: |
          bun run lint
          bun run typecheck
          bun run test
          bun run plugin:check
      - name: Prepare release
        uses: tanaabased/actions/prepare-release@v1
        with:
          commands: |
            version-injector .codex-plugin/plugin.json --style json --version "$PREPARE_RELEASE_VERSION"
            version-injector openclaw.plugin.json --style json --version "$PREPARE_RELEASE_VERSION"
            bun run format:write
      - name: Validate prepared package
        run: |
          bun run build
          bun run format:check
      - name: Pack prepared package
        id: pack
        uses: tanaabased/actions/npm-pack@v1
      - name: Validate packed plugin package
        env:
          AGENT_SYSTEM_PACKAGE: ${{ steps.pack.outputs.tarball-path }}
        run: bun run test:release
      - name: Stage packaged Codex plugin
        env:
          AGENT_SYSTEM_PACKAGE: ${{ steps.pack.outputs.tarball-path }}
        run: |
          mkdir -p .temp/codex-plugin
          tar -xzf "$AGENT_SYSTEM_PACKAGE" -C .temp/codex-plugin --strip-components=1
      - name: Validate packaged Codex plugin
        uses: tanaabased/actions/validate-codex-plugin@v1
        with:
          plugin-directory: .temp/codex-plugin
      - name: Verify installed Codex skills
        env:
          AGENT_SYSTEM_PACKAGE: ${{ steps.pack.outputs.tarball-path }}
        run: bun run test:codex-plugin
      - name: Publish tested npm package
        uses: tanaabased/actions/publish-npm@v1
        with:
          tarball: ${{ steps.pack.outputs.tarball-path }}
          update-prerelease-tag-on-stable: true
          channel-token: ${{ secrets.TANAAB_NPM_DEPLOY }}

  release-clawhub:
    name: Publish ClawHub package
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      TERM: xterm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Bun
        uses: tanaabased/actions/setup-bun@v1
      - name: Install Node
        uses: tanaabased/actions/setup-node@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Validate source
        run: |
          bun run lint
          bun run typecheck
          bun run test
          bun run plugin:check
      - name: Prepare release
        uses: tanaabased/actions/prepare-release@v1
        with:
          commands: |
            version-injector .codex-plugin/plugin.json --style json --version "$PREPARE_RELEASE_VERSION"
            version-injector openclaw.plugin.json --style json --version "$PREPARE_RELEASE_VERSION"
            bun run format:write
      - name: Validate prepared package
        run: |
          bun run build
          bun run format:check
      - name: Pack prepared package
        id: pack
        uses: tanaabased/actions/npm-pack@v1
      - name: Validate packed plugin package
        env:
          AGENT_SYSTEM_PACKAGE: ${{ steps.pack.outputs.tarball-path }}
        run: bun run test:release
      - name: Publish tested ClawHub package
        uses: tanaabased/actions/publish-clawhub@v1
        with:
          tarball: ${{ steps.pack.outputs.tarball-path }}
          owner: tanaab
          tags: ${{ github.event.release.prerelease && 'edge' || 'latest,edge' }}
          source-repo: ${{ github.repository }}
          source-commit: ${{ github.sha }}
          clawhub-token: ${{ secrets.TANAAB_LOBSTER_BOAT }}
          wait-timeout: 1800

  publish-repo:
    name: Publish repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TERM: xterm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Bun
        uses: tanaabased/actions/setup-bun@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Prepare and synchronize release
        uses: tanaabased/actions/publish-repo@v1
        with:
          commands: |
            version-injector .codex-plugin/plugin.json --style json --version "$PREPARE_RELEASE_VERSION"
            version-injector openclaw.plugin.json --style json --version "$PREPARE_RELEASE_VERSION"
            bun run format:write
          sync-token: ${{ secrets.TANAAB_COAXIUM_INJECTOR }}
