name: Release

on:
  release:
    types:
      - published

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  publish-npm:
    name: Publish npm
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    env:
      TERM: xterm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install Bun
        uses: tanaabased/actions/setup-bun@v1
      - name: Install Node
        uses: tanaabased/actions/setup-node@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Validate source
        run: |
          bun run lint
          bun run typecheck
          bun run test
          bun run plugin:check
      - name: Prepare release
        uses: tanaabased/actions/prepare-release@v1
        with:
          commands: |
            version-injector .codex-plugin/plugin.json --style json --version "$PREPARE_RELEASE_VERSION"
            version-injector openclaw.plugin.json --style json --version "$PREPARE_RELEASE_VERSION"
            bun run format:write
      - name: Validate prepared package
        run: |
          bun run build
          bun run format:check
      - name: Pack prepared package
        id: pack
        uses: tanaabased/actions/npm-pack@v1
      - name: Validate packed plugin package
        env:
          AGENT_SYSTEM_PACKAGE: ${{ steps.pack.outputs.tarball-path }}
        run: bun run test:release
      - name: Stage packaged Codex plugin
        env:
          AGENT_SYSTEM_PACKAGE: ${{ steps.pack.outputs.tarball-path }}
        run: |
          mkdir -p .temp/codex-plugin
          tar -xzf "$AGENT_SYSTEM_PACKAGE" -C .temp/codex-plugin --strip-components=1
      - name: Validate packaged Codex plugin
        uses: tanaabased/actions/validate-codex-plugin@v1
        with:
          plugin-directory: .temp/codex-plugin
      - name: Verify installed Codex skills
        env:
          AGENT_SYSTEM_PACKAGE: ${{ steps.pack.outputs.tarball-path }}
        run: bun run test:codex-plugin
      - name: Publish npm
        uses: tanaabased/actions/publish-npm@v1
        with:
          tarball: ${{ steps.pack.outputs.tarball-path }}
          sync-edge-tag: true

  publish-clawhub:
    name: Publish ClawHub
    continue-on-error: true
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      TERM: xterm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install Bun
        uses: tanaabased/actions/setup-bun@v1
      - name: Install Node
        uses: tanaabased/actions/setup-node@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Validate source
        run: |
          bun run lint
          bun run typecheck
          bun run test
          bun run plugin:check
      - name: Prepare release
        uses: tanaabased/actions/prepare-release@v1
        with:
          commands: |
            version-injector .codex-plugin/plugin.json --style json --version "$PREPARE_RELEASE_VERSION"
            version-injector openclaw.plugin.json --style json --version "$PREPARE_RELEASE_VERSION"
            bun run format:write
      - name: Validate prepared package
        run: |
          bun run build
          bun run format:check
      - name: Pack prepared package
        id: pack
        uses: tanaabased/actions/npm-pack@v1
      - name: Validate packed plugin package
        env:
          AGENT_SYSTEM_PACKAGE: ${{ steps.pack.outputs.tarball-path }}
        run: bun run test:release
      - name: Publish ClawHub
        id: publish-clawhub
        uses: tanaabased/actions/publish-clawhub@v1
        with:
          tarball: ${{ steps.pack.outputs.tarball-path }}
          owner: tanaab
          source-repo: ${{ github.repository }}
          source-commit: ${{ github.sha }}
          clawhub-token: ${{ secrets.TANAAB_LOBSTER_BOAT }}
          wait-timeout: 1800
      - name: Warn about incomplete ClawHub publication
        if: ${{ failure() }}
        run: |
          echo "::warning title=ClawHub publication not confirmed::The optional ClawHub job failed. Check its logs and publication status before retrying; an upload may still be pending. npm and repository publication have independent results."
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### ClawHub publication not confirmed

          This optional job failed. Check the logs and the version's publication status before retrying; an accepted upload may still be pending.

          Use the npm installation path for published releases. npm and repository publication have independent results.

          Upstream tracking: [publish errors #3888](https://github.com/openclaw/clawhub/issues/3888), [backend memory failure #3788](https://github.com/openclaw/clawhub/issues/3788), and [stalled checks #4119](https://github.com/openclaw/clawhub/issues/4119). These are related reports, not a diagnosis of every failure. Restore blocking publication only after a representative release publishes successfully with the deployed fix.
          EOF

  publish-repo:
    name: Publish repo
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TERM: xterm
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install Bun
        uses: tanaabased/actions/setup-bun@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Publish repo
        uses: tanaabased/actions/publish-repo@v1
        with:
          commands: |
            version-injector .codex-plugin/plugin.json --style json --version "$PREPARE_RELEASE_VERSION"
            version-injector openclaw.plugin.json --style json --version "$PREPARE_RELEASE_VERSION"
            bun run format:write
          sync-token: ${{ secrets.TANAAB_COAXIUM_INJECTOR }}
