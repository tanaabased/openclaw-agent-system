name: OpenClaw compatibility tests

on:
  pull_request:

permissions:
  contents: read

env:
  NO_COLOR: '1'

jobs:
  compatibility:
    name: OpenClaw ${{ matrix.openclaw-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        openclaw-version:
          - 2026.9.2
          - 2026.9.3
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: PATH updates
        shell: bash
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/scripts" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Install OpenClaw compatibility target
        run: |
          bun add --no-save --ignore-scripts --exact "openclaw@${{ matrix.openclaw-version }}"
          test "$(node -p "require('./node_modules/openclaw/package.json').version")" = "${{ matrix.openclaw-version }}"
      - name: Check types
        run: bun run typecheck
      - name: Prepare release-shaped build
        uses: tanaabased/prepare-release-action@v1
        with:
          version: dev
          sync: false
          commands: |
            version-injector openclaw.plugin.json --style json --version "$PREPARE_RELEASE_VERSION"
            bun run format:write
            bun run build
      - name: Pack prepared plugin
        shell: bash
        env:
          OPENCLAW_COMPATIBILITY_TEST_VERSION: ${{ matrix.openclaw-version }}
        run: |
          bun run plugin:check
          bun run format:check
          archive_name="$(npm pack --silent --pack-destination "$RUNNER_TEMP")"
          test -n "$archive_name"
          echo "AGENT_SYSTEM_PACKAGE=$RUNNER_TEMP/$archive_name" >> "$GITHUB_ENV"
      - name: Run installed compatibility example
        run: bun run leia examples/install/README.md --stdin --retry 0
