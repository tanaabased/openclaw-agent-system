name: Component tests

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: components-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  components:
    name: ${{ matrix.suite }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: component
            os: ubuntu-24.04
          - suite: os
            os: ubuntu-24.04
          - suite: os
            os: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Bun
        uses: tanaabased/actions/setup-bun@v1
      - name: Install Node
        uses: tanaabased/actions/setup-node@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run component tests
        run: bun run test:${{ matrix.suite }}
