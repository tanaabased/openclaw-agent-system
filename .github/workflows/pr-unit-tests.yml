name: Unit tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    # restore this pr's full checks when the integrated candidate is ready.
    if: github.event.pull_request.number != 408
    name: ubuntu-24.04
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Bun
        uses: tanaabased/actions/setup-bun@v1
      - name: Install Node
        uses: tanaabased/actions/setup-node@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run unit tests
        run: bun run test:unit
      - name: Run static checks
        run: bun run test:static
