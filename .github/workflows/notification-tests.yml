name: Notification tests

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Scenario focus
        required: true
        type: choice
        default: all
        options:
          - assignment
          - assignment-provider-proof
          - implementation
          - pr
          - comment
          - retirement
          - all

permissions:
  contents: read

jobs:
  notifications:
    if: inputs.scenario != 'assignment-provider-proof'
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ inputs.scenario == 'all' && fromJSON('["assignment","implementation","pr","comment","retirement"]') || fromJSON(format('["{0}"]', inputs.scenario)) }}
    uses: ./.github/workflows/reusable-notification-test.yml
    with:
      provider: live
      scenario: ${{ matrix.scenario }}
    secrets:
      openai_api_key: ${{ secrets.TANAAB_ALTERNATE_MALE_KEY }}
      op_service_account_token: ${{ secrets.TANAAB_OP_TESTVAULT }}
  mock:
    if: inputs.scenario == 'assignment-provider-proof' || inputs.scenario == 'all'
    uses: ./.github/workflows/reusable-notification-test.yml
    with:
      provider: mock
      scenario: assignment-provider-proof
    secrets:
      op_service_account_token: ${{ secrets.TANAAB_OP_TESTVAULT }}
