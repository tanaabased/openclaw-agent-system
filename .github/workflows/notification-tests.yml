name: Notification Tests

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Scenario focus
        required: true
        type: choice
        default: all
        options:
          - assignment
          - implementation
          - pr-handoff
          - pr-continuation
          - comment
          - retirement
          - all
      runner:
        description: Runner
        required: true
        type: choice
        default: ubuntu-24.04
        options:
          - ubuntu-24.04
          - macos-26

permissions:
  contents: read

jobs:
  notifications:
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ inputs.scenario == 'all' && fromJSON('["assignment","implementation","pr-handoff","pr-continuation","comment","retirement"]') || fromJSON(format('["{0}"]', inputs.scenario)) }}
    uses: ./.github/workflows/reusable-notification-test.yml
    with:
      provider: live
      runner: ${{ inputs.runner }}
      scenario: ${{ matrix.scenario }}
    secrets:
      openai_api_key: ${{ secrets.TANAAB_ALTERNATE_MALE_KEY }}
      op_service_account_token: ${{ secrets.TANAAB_OP_TESTVAULT }}
