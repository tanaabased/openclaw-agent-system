name: Notification Tests

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Scenario focus
        required: true
        type: choice
        default: all
        options:
          - assignment
          - concurrency
          - guided-assignment
          - implementation
          - pr-lifecycle
          - comment
          - retirement
          - operator-access
          - all
      runner:
        description: Runner
        required: true
        type: choice
        default: ubuntu-24.04
        options:
          - ubuntu-24.04
          - macos-26

permissions:
  contents: read

concurrency:
  group: notification-test-account
  cancel-in-progress: false

jobs:
  notifications:
    if: ${{ inputs.scenario != 'concurrency' }}
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ inputs.scenario == 'all' && fromJSON('["assignment","guided-assignment","implementation","pr-lifecycle","comment","retirement","operator-access"]') || fromJSON(format('["{0}"]', inputs.scenario)) }}
    uses: ./.github/workflows/reusable-notification-test.yml
    with:
      provider: ${{ matrix.scenario == 'operator-access' && 'mock' || 'live' }}
      runner: ${{ inputs.runner }}
      scenario: ${{ matrix.scenario }}
    secrets:
      gh_token_emori: ${{ secrets.GH_TOKEN_EMORI }}
      gh_token_tanaabot: ${{ secrets.GH_TOKEN_TANAABOT }}
      openai_api_key: ${{ secrets.TANAAB_ALTERNATE_MALE_KEY }}
      op_service_account_token: ${{ secrets.TANAAB_OP_TESTVAULT }}
  concurrency:
    needs: notifications
    if: ${{ always() && !cancelled() && (inputs.scenario == 'all' || inputs.scenario == 'concurrency') }}
    uses: ./.github/workflows/reusable-notification-test.yml
    with:
      provider: mock
      runner: ${{ inputs.runner }}
      scenario: concurrency
    secrets:
      gh_token_emori: ${{ secrets.GH_TOKEN_EMORI }}
      gh_token_tanaabot: ${{ secrets.GH_TOKEN_TANAABOT }}
      op_service_account_token: ${{ secrets.TANAAB_OP_TESTVAULT }}
