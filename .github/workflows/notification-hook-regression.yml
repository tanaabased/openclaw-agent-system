name: Notification hook regression

on:
  pull_request:

permissions:
  contents: read

jobs:
  hook-regression:
    name: ${{ matrix.revision }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
        revision: [baseline, fixed]
    steps:
      - name: Checkout regression harness
        uses: actions/checkout@v7
        with:
          path: regression
      - name: Checkout tested source
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.revision == 'baseline' && '2fe15db3fe05d9279e5e27181532814dea9e6d08' || github.sha }}
          path: source
      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version-file: source/.node-version
          package-manager-cache: false
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: source/.bun-version
      - name: Build tested plugin
        working-directory: source
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun run build
          npm pack --silent --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/hook-package-name"
          echo "$GITHUB_WORKSPACE/source/node_modules/.bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/source/scripts" >> "$GITHUB_PATH"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Inspect isolated installed regression
        working-directory: source
        run: |
          archive_name="$(cat "$RUNNER_TEMP/hook-package-name")"
          openclaw-setup --workspace "$RUNNER_TEMP/main" --agent-system-plugin "$RUNNER_TEMP/$archive_name"
          node --import tsx "$GITHUB_WORKSPACE/regression/scripts/notification-hook-regression-task.ts" "$GITHUB_WORKSPACE/regression/examples/doctor/hook-data" "$RUNNER_TEMP/hook-evidence" "${{ matrix.revision }}"
      - name: Preserve baseline and fixed evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: notification-hook-${{ matrix.revision }}-${{ matrix.os }}
          path: ${{ runner.temp }}/hook-evidence
          if-no-files-found: error
