name: OpenClaw package smoke test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  NO_COLOR: '1'

jobs:
  package-smoke:
    name: Packed plugin / OpenClaw 2026.9.3
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: PATH updates
        shell: bash
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "OPENCLAW_STATE_DIR=$RUNNER_TEMP/openclaw-state" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/openclaw/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/scripts" >> "$GITHUB_PATH"
      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Prepare release-shaped candidate
        uses: tanaabased/prepare-release-action@v1
        with:
          version: dev
          sync: false
          commands: |
            version-injector openclaw.plugin.json --style json --version "$PREPARE_RELEASE_VERSION"
            bun run format:write
            bun run build
      - name: Pack candidate
        shell: bash
        run: |
          archive_name="$(npm pack --silent --pack-destination "$RUNNER_TEMP")"
          test -n "$archive_name"
          echo "AGENT_SYSTEM_PACKAGE=$RUNNER_TEMP/$archive_name" >> "$GITHUB_ENV"
      - name: Install OpenClaw 2026.9.3
        run: npm install --global --prefix "$RUNNER_TEMP/openclaw" openclaw@2026.9.3
      - name: Verify packed plugin and Gateway
        shell: bash
        run: |
          hash -r
          openclaw --version | grep -F '2026.9.3'
          openclaw-setup --workspace "$RUNNER_TEMP/workspace"
          openclaw plugins install "npm-pack:$AGENT_SYSTEM_PACKAGE" --force --accept-capabilities
          openclaw plugins enable agent-system
          openclaw plugins inspect agent-system --runtime --json \
            | jq -e --arg source_path "$AGENT_SYSTEM_PACKAGE" '
                .plugin.status == "loaded"
                  and .plugin.error == null
                  and .install.sourcePath == $source_path
                  and .install.version == .plugin.version
              '
          mkdir -p "$RUNNER_TEMP/candidate-gateway"
          openclaw-gateway start --state-dir "$RUNNER_TEMP/candidate-gateway"
          openclaw gateway call agents.list --json --timeout 3000 \
            | jq -e '.agents | type == "array"'
          openclaw-gateway stop --timeout 60 --state-dir "$RUNNER_TEMP/candidate-gateway"
      - name: Stop disposable Gateway
        if: always()
        shell: bash
        run: openclaw-gateway stop --timeout 60 --state-dir "$RUNNER_TEMP/candidate-gateway" || true
