name: Lint

on:
  pull_request:

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  lint:
    # restore this pr's full checks when the integrated candidate is ready.
    if: github.event.pull_request.number != 408
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Bun
        uses: tanaabased/actions/setup-bun@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Run linter
        run: bun run lint
      - name: Check types
        run: bun run typecheck
      - name: Build plugin
        run: bun run build
      - name: Check plugin metadata
        run: bun run plugin:check
