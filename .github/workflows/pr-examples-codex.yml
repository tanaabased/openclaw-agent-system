name: Codex tests

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: examples-codex-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: '1'
  NO_COLOR: '1'

jobs:
  examples:
    name: ${{ matrix.example }} (ubuntu-24.04)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        example:
          - codex-install
          - codex-automations
          - codex-notifications
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: PATH updates
        shell: bash
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/scripts" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Brew updates
        shell: bash
        run: HOMEBREW_NO_AUTO_UPDATE= brew update-if-needed
      - name: Install OpenClaw
        uses: tanaabased/actions/setup-openclaw@v1
      - name: Install Node
        uses: tanaabased/actions/setup-node@v1
      - name: Install Bun
        uses: tanaabased/actions/setup-bun@v1
      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Prepare release-shaped build
        uses: tanaabased/actions/prepare-release@v1
        with:
          version: dev
          commands: |
            version-injector .codex-plugin/plugin.json --style json --version "$PREPARE_RELEASE_VERSION"
            version-injector openclaw.plugin.json --style json --version "$PREPARE_RELEASE_VERSION"
            bun run format:write
            bun run build
      - name: Check prepared plugin
        run: |
          bun run plugin:check
          bun run format:check
      - name: Pack prepared plugin
        id: pack
        uses: tanaabased/actions/npm-pack@v1
      - name: Run Leia-backed example
        shell: bash
        env:
          AGENT_SYSTEM_PACKAGE: ${{ steps.pack.outputs.tarball-path }}
          CODEX_HOME: ${{ runner.temp }}/codex-home
          CODEX_TOOLS_CODEX_HOME: ${{ runner.temp }}/codex-home
          XDG_CONFIG_HOME: ${{ runner.temp }}/agent-system-config
        run: leia "examples/${{ matrix.example }}/README.md" --stdin --retry 0
      - name: RUNNING A LEVEL THREE DIAGNOSTICS
        if: failure()
        shell: bash
        run: |
          if command -v openclaw-diagnostics >/dev/null; then
            helper_dir=$(dirname "$(command -v openclaw-diagnostics)")
            if [[ -d "${SETUP_OPENCLAW_STATE_DIR:-}" ]]; then
              for setup_log in "$SETUP_OPENCLAW_STATE_DIR"/setup-log.*; do
                [[ -f "$setup_log" ]] || continue
                printf 'unfinished setup log: %s\n' "$(basename "$setup_log")"
                node "$helper_dir/lib/redact-stream.mjs" < "$setup_log" | tail -n 30 | tail -c 8192
              done
            fi
            openclaw-diagnostics --debug
          else
            echo "OpenClaw setup helpers are unavailable; see the setup action failure above."
          fi
