name: Test resource cleanup
description: Clean resources tagged for one completed example run and attempt.
inputs:
  run-id:
    description: Completed source workflow run
    required: true
  attempt:
    description: Exact source run attempt
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        TEST_SOURCE_RUN: ${{ inputs.run-id }}
        TEST_SOURCE_ATTEMPT: ${{ inputs.attempt }}
      run: bun "$GITHUB_ACTION_PATH/../../../scripts/test-resource-cleanup.ts"
