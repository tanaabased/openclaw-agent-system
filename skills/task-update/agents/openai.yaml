interface:
  display_name: 'Agent System Task Update'
  short_description: 'Publish verified task progress to its GitHub issue'
  icon_small: './assets/icon-small.svg'
  icon_large: './assets/icon-large.svg'
  brand_color: '#00c88a'
  default_prompt: "Use $agent-system-task-update to update the selected task's GitHub issue with verified progress from this chat. Publish only material missing facts and show the confirmed public reply; do not post if already current."
policy:
  allow_implicit_invocation: true
